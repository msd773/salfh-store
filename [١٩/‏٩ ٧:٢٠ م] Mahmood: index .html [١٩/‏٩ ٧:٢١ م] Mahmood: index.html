<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>متجر سلفح</title>
<style>
body{font-family:Tahoma;background:#f6f6f6;margin:0}
header{background:#000;color:#fff;padding:25px;text-align:center}
.products{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{background:#fff;border-radius:15px;padding:10px;text-align:center}
.card img{width:100%;border-radius:12px}
.price{color:#e91e63;font-weight:bold}
.btn{background:#000;color:#fff;border:0;padding:10px;border-radius:20px;width:100%;margin-top:8px}
</style>
</head>
<body>
<header><h1>متجر سلفح</h1><p>أفخم المنتجات - توصيل لكل اليمن</p></header>
<div class="products">
<div class="card"><img src="https://picsum.photos/300/300?1"><h3>عطر رجالي فاخر</h3><div class="price">8500 ر.ي</div><button class="btn" onclick="location.href='https://wa.me/967700000000'">اطلب واتساب</button></div>
<div class="card"><img src="https://picsum.photos/300/300?2"><h3>ساعة يد أنيقة</h3><div class="price">12000 ر.ي</div><button class="btn" onclick="location.href='https://wa.me/967700000000'">اطلب واتساب</button></div>
<div class="card"><img src="https://picsum.photos/300/300?3"><h3>حقيبة جلد</h3><div class="price">9500 ر.ي</div><button class="btn" onclick="location.href='https://wa.me/967700000000'">اطلب واتساب</button></div>
<div class="card"><img src="https://picsum.photos/300/300?4"><h3>نظارة شمسية</h3><div class="price">6500 ر.ي</div><button class="btn" onclick="location.href='https://wa.me/967700000000'">اطلب واتساب</button></div>
</div>
</body>
</html>
