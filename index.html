<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متجر الخلاص - Salfh Store</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,Tahoma}
body{background:#f5f5f7;color:#222}
header{background:#111;color:#fff;padding:18px;text-align:center}
.hero{background:linear-gradient(135deg,#0f172a,#1e40af);color:#fff;padding:40px 20px;text-align:center}
.hero h2{font-size:32px;margin-bottom:10px}
.hero a{display:inline-block;margin-top:15px;background:#fff;color:#1e40af;padding:12px 28px;border-radius:30px;text-decoration:none;font-weight:bold}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;padding:20px;max-width:1100px;margin:auto}
.card{background:#fff;border-radius:18px;padding:16px;box-shadow:0 8px 20px rgba(0,0,0,.06);text-align:center}
.card img{width:100%;height:160px;object-fit:cover;border-radius:12px;background:#eee}
.card h3{margin:12px 0 6px}
.card .price{color:#1e40af;font-weight:bold;font-size:20px;margin:6px 0}
.card button{background:#111;color:#fff;border:0;padding:10px 18px;border-radius:10px;width:100%;cursor:pointer}
footer{text-align:center;padding:30px;color:#666}
</style>
</head>
<body>
<header><h1>متجر الخلاص</h1><p>Salfh Store</p></header>
<div class="hero"><h2>أهلاً بك في متجر سلفة</h2><p>توصيل لكل اليمن - الدفع عند الاستلام</p><a href="#products">تسوق الآن</a></div>
<div id="products" class="products">
<div class="card"><img src="https://picsum.photos/400/300?1"><h3>ساعة ذكية</h3><div class="price">12,000 ريال</div><button onclick="order('ساعة')">اطلب واتساب</button></div>
<div class="card"><img src="https://picsum.photos/400/300?2"><h3>سماعة بلوتوث</h3><div class="price">8,500 ريال</div><button onclick="order('سماعة')">اطلب واتساب</button></div>
<div class="card"><img src="https://picsum.photos/400/300?3"><h3>شاحن سريع</h3><div class="price">5,000 ريال</div><button onclick="order('شاحن')">اطلب واتساب</button></div>
<div class="card"><img src="https://picsum.photos/400/300?4"><h3>حامل جوال</h3><div class="price">3,500 ريال</div><button onclick="order('حامل')">اطلب واتساب</button></div>
</div>
<footer>© 2026 متجر الخلاص - تعز</footer>
<script>
function order(p){window.open("https://wa.me/967773000000?text="+encodeURIComponent("أريد طلب: "+p)," _blank")}
</script>
</body>
</html>
