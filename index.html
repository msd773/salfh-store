
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>متجر الخلاص - إب</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#fafafa}
.header{background:#111;color:#fff;padding:20px;text-align:center}
.hero{padding:30px;background:linear-gradient(135deg,#000,#333);color:#fff;text-align:center}
.btn{background:#25D366;color:#fff;padding:12px 20px;border-radius:12px;text-decoration:none;display:inline-block;margin-top:12px;font-weight:bold}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.card{background:#fff;border-radius:16px;padding:10px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.card img{width:100%;height:130px;object-fit:cover;border-radius:10px;background:#eee}
.card h3{font-size:14px;margin:8px 0}
.price{color:#16a34a;font-weight:800}
.card button{background:#111;color:#fff;border:0;padding:9px;border-radius:10px;width:100%;margin-top:6px}
</style>
</head>
<body>
<div class="header"><h1>متجر الخلاص.STORE</h1><p>إب - توصيل لكل اليمن</p></div>
<div class="hero">
<h2>كل اللي تحتاجه بسعر الجملة</h2>
<p>دفع عند الاستلام - توصيل سريع</p>
<a class="btn" href="https://wa.me/967700000000">اطلب واتساب الآن</a>
</div>
<div class="grid">
<div class="card"><img src="https://picsum.photos/300?1"><h3>سماعة P9</h3><div class="price">8,500 ر.ي</div><button onclick="location.href='https://wa.me/967700000000?text=اريد سماعة P9'">اطلب</button></div>
<div class="card"><img src="https://picsum.photos/300?2"><h3>حذاء رياضي</h3><div class="price">9,900 ر.ي</div><button onclick="location.href='https://wa.me/967700000000?text=اريد الحذاء'">اطلب</button></div>
<div class="card"><img src="https://picsum.photos/300?3"><h3>عطر فاخر</h3><div class="price">6,500 ر.ي</div><button onclick="location.href='https://wa.me/967700000000?text=اريد العطر'">اطلب</button></div>
<div class="card"><img src="https://picsum.photos/300?4"><h3>ساعة ذكية</h3><div class="price">11,000 ر.ي</div><button onclick="location.href='https://wa.me/967700000000?text=اريد الساعة'">اطلب</button></div>
</div>
</body>
</html>
